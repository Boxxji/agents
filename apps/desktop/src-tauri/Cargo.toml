[package]
name = "hanzo-agents"
version = "1.5.0"
description = "Hanzo Agents — Multi-agent orchestration desktop app"
authors = ["Hanzo AI, Inc. <dev@hanzo.ai>"]
license = "Apache-2.0"
repository = "https://github.com/hanzoai/agents"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36.0", features = ["macros", "rt-multi-thread", "process", "time"] }
dirs = "6.0"
rand = "0.8"
hex = "0.4.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
